<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="美味小厨在线点菜单：挑选菜品，加入订单。">
  <title>在线点菜单 - 美味小厨</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu">

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">&lt;/&gt;</span>
        <span class="logo-name">DevLog</span>
      </a>
      <div class="header-right">
        <nav class="main-nav" aria-label="主导航">
        <a href="index.html" class="nav-link">首页</a>
        <a href="articles.html" class="nav-link">文章</a>
        <a href="books.html" class="nav-link">图书</a>
        <a href="menu.html" class="nav-link active">菜单</a>
        <a href="links.html" class="nav-link">友链</a>
        <a href="structure.html" class="nav-link">结构</a>
        <a href="about.html" class="nav-link">关于</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="title-bar">
      <div class="container">
        <span class="section-eyebrow">// RESTAURANT</span>
        <h1>美味小厨</h1>
        <p class="title-bar-sub">在线点菜单 · 挑选喜欢的菜品加入订单</p>
      </div>
    </section>

    <div class="container menu-main">
      <div id="menu-list" class="dish-grid" data-reveal></div>

      <section class="order-section" data-reveal>
        <div class="order-head">
          <h2>我的订单</h2>
          <div class="order-actions">
            <button id="submit-order" class="btn btn-primary" type="button">提交订单</button>
            <button id="clear-order" class="btn btn-ghost" type="button">清空订单</button>
          </div>
        </div>
        <div id="order-empty" class="order-empty">还没有点菜，点击菜品卡片上的"加入订单"开始点餐。</div>
        <div id="order-table-wrap" class="order-table-wrap" hidden>
          <table class="order-table">
            <thead>
              <tr>
                <th>菜品</th>
                <th>单价</th>
                <th>数量</th>
                <th>小计</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="order-body"></tbody>
            <tfoot>
              <tr class="order-total-row">
                <td colspan="3">总价</td>
                <td id="order-total" class="order-total">¥0</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-info">© 2026 DevLog · 建站于 2026 年 8 月</p>
      <p class="footer-links">
        <a href="index.html">首页</a>
        <a href="articles.html">文章</a>
        <a href="books.html">图书</a>
        <a href="menu.html">菜单</a>
        <a href="links.html">友链</a>
        <a href="structure.html">结构</a>
        <a href="about.html">关于</a>
      </p>
      <a class="codex-badge" href="https://openai.com/codex/" target="_blank" rel="noopener" aria-label="由 Codex 驱动">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C12.9 6.4 17.6 11.1 24 12 17.6 12.9 12.9 17.6 12 24 11.1 17.6 6.4 12.9 0 12 6.4 11.1 11.1 6.4 12 0Z"/>
        </svg>
        <span>由 Codex 驱动</span>
      </a>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="返回顶部" title="返回顶部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div id="order-toast" class="order-toast" role="status" hidden></div>

  <script src="js/main.js"></script>
</body>
</html>
